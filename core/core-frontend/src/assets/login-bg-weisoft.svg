<svg width="1125" height="1440" viewBox="0 0 1125 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8EEFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DDE7FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- 紫色渐变 - weisoft 主题色 -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    
    <!-- 蓝色渐变 -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- 浅紫色渐变 -->
    <linearGradient id="lightPurpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4B5FD;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1125" height="1440" fill="url(#bgGradient)"/>
  
  <!-- 装饰性圆圈 -->
  <circle cx="100" cy="100" r="150" fill="url(#lightPurpleGradient)" opacity="0.3"/>
  <circle cx="1000" cy="1300" r="200" fill="url(#lightPurpleGradient)" opacity="0.3"/>
  <circle cx="900" cy="200" r="100" fill="url(#lightPurpleGradient)" opacity="0.2"/>
  
  <!-- 机器人图标 (weisoft logo 风格) - 放在左上角 -->
  <g transform="translate(80, 80)">
    <!-- 机器人头部 -->
    <rect x="20" y="20" width="60" height="60" rx="8" fill="url(#purpleGradient)"/>
    <!-- 眼睛 -->
    <circle cx="38" cy="42" r="6" fill="white"/>
    <circle cx="62" cy="42" r="6" fill="white"/>
    <circle cx="38" cy="42" r="3" fill="#4F46E5"/>
    <circle cx="62" cy="42" r="3" fill="#4F46E5"/>
    <!-- 嘴巴 -->
    <path d="M 35 58 Q 50 65 65 58" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 天线 -->
    <line x1="50" y1="20" x2="50" y2="5" stroke="url(#purpleGradient)" stroke-width="3"/>
    <circle cx="50" cy="5" r="4" fill="#60A5FA"/>
  </g>
  
  <!-- BI 仪表板示意图 1 - 柱状图 -->
  <g transform="translate(150, 300)">
    <rect x="0" y="0" width="300" height="250" rx="12" fill="white" opacity="0.95" filter="drop-shadow(0 4px 12px rgba(79, 70, 229, 0.15))"/>
    <!-- 标题 -->
    <text x="20" y="35" font-family="Arial" font-size="18" font-weight="bold" fill="#4F46E5">销售数据分析</text>
    <!-- 柱状图 -->
    <rect x="40" y="100" width="40" height="100" rx="4" fill="url(#purpleGradient)"/>
    <rect x="100" y="80" width="40" height="120" rx="4" fill="url(#blueGradient)"/>
    <rect x="160" y="120" width="40" height="80" rx="4" fill="url(#purpleGradient)"/>
    <rect x="220" y="90" width="40" height="110" rx="4" fill="url(#blueGradient)"/>
    <!-- X轴 -->
    <line x1="30" y1="210" x2="270" y2="210" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Y轴 -->
    <line x1="30" y1="70" x2="30" y2="210" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  
  <!-- BI 仪表板示意图 2 - 饼图 -->
  <g transform="translate(550, 300)">
    <rect x="0" y="0" width="300" height="250" rx="12" fill="white" opacity="0.95" filter="drop-shadow(0 4px 12px rgba(79, 70, 229, 0.15))"/>
    <!-- 标题 -->
    <text x="20" y="35" font-family="Arial" font-size="18" font-weight="bold" fill="#4F46E5">市场份额</text>
    <!-- 饼图 -->
    <circle cx="150" cy="140" r="70" fill="url(#purpleGradient)"/>
    <path d="M 150 140 L 150 70 A 70 70 0 0 1 220 140 Z" fill="url(#blueGradient)"/>
    <path d="M 150 140 L 220 140 A 70 70 0 0 1 180 200 Z" fill="#A78BFA"/>
    <!-- 图例 -->
    <rect x="40" y="220" width="15" height="15" rx="2" fill="url(#purpleGradient)"/>
    <text x="60" y="232" font-family="Arial" font-size="12" fill="#64748B">产品A</text>
    <rect x="130" y="220" width="15" height="15" rx="2" fill="url(#blueGradient)"/>
    <text x="150" y="232" font-family="Arial" font-size="12" fill="#64748B">产品B</text>
    <rect x="220" y="220" width="15" height="15" rx="2" fill="#A78BFA"/>
    <text x="240" y="232" font-family="Arial" font-size="12" fill="#64748B">产品C</text>
  </g>
  
  <!-- BI 仪表板示意图 3 - 折线图 -->
  <g transform="translate(150, 650)">
    <rect x="0" y="0" width="300" height="250" rx="12" fill="white" opacity="0.95" filter="drop-shadow(0 4px 12px rgba(79, 70, 229, 0.15))"/>
    <!-- 标题 -->
    <text x="20" y="35" font-family="Arial" font-size="18" font-weight="bold" fill="#4F46E5">趋势分析</text>
    <!-- 折线图 -->
    <polyline points="40,180 80,140 120,160 160,100 200,120 240,80" 
              stroke="url(#purpleGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="40,200 80,170 120,180 160,140 200,150 240,120" 
              stroke="url(#blueGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 数据点 -->
    <circle cx="40" cy="180" r="5" fill="#A78BFA"/>
    <circle cx="80" cy="140" r="5" fill="#A78BFA"/>
    <circle cx="120" cy="160" r="5" fill="#A78BFA"/>
    <circle cx="160" cy="100" r="5" fill="#A78BFA"/>
    <circle cx="200" cy="120" r="5" fill="#A78BFA"/>
    <circle cx="240" cy="80" r="5" fill="#A78BFA"/>
    <!-- 坐标轴 -->
    <line x1="30" y1="70" x2="30" y2="210" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="30" y1="210" x2="270" y2="210" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  
  <!-- BI 仪表板示意图 4 - 数据卡片 -->
  <g transform="translate(550, 650)">
    <rect x="0" y="0" width="300" height="250" rx="12" fill="white" opacity="0.95" filter="drop-shadow(0 4px 12px rgba(79, 70, 229, 0.15))"/>
    <!-- 标题 -->
    <text x="20" y="35" font-family="Arial" font-size="18" font-weight="bold" fill="#4F46E5">关键指标</text>
    
    <!-- 卡片1 -->
    <rect x="20" y="60" width="120" height="80" rx="8" fill="url(#purpleGradient)" opacity="0.1"/>
    <text x="35" y="85" font-family="Arial" font-size="14" fill="#64748B">总收入</text>
    <text x="35" y="115" font-family="Arial" font-size="24" font-weight="bold" fill="#4F46E5">¥2.5M</text>
    
    <!-- 卡片2 -->
    <rect x="160" y="60" width="120" height="80" rx="8" fill="url(#blueGradient)" opacity="0.1"/>
    <text x="175" y="85" font-family="Arial" font-size="14" fill="#64748B">用户数</text>
    <text x="175" y="115" font-family="Arial" font-size="24" font-weight="bold" fill="#3B82F6">15.8K</text>
    
    <!-- 卡片3 -->
    <rect x="20" y="160" width="120" height="80" rx="8" fill="url(#purpleGradient)" opacity="0.1"/>
    <text x="35" y="185" font-family="Arial" font-size="14" fill="#64748B">转化率</text>
    <text x="35" y="215" font-family="Arial" font-size="24" font-weight="bold" fill="#4F46E5">23.5%</text>
    
    <!-- 卡片4 -->
    <rect x="160" y="160" width="120" height="80" rx="8" fill="url(#blueGradient)" opacity="0.1"/>
    <text x="175" y="185" font-family="Arial" font-size="14" fill="#64748B">增长率</text>
    <text x="175" y="215" font-family="Arial" font-size="24" font-weight="bold" fill="#3B82F6">+18%</text>
  </g>
  
  <!-- 底部 weisoft 文字 logo -->
  <g transform="translate(400, 1100)">
    <!-- 机器人小图标 -->
    <rect x="0" y="0" width="40" height="40" rx="6" fill="url(#purpleGradient)"/>
    <circle cx="13" cy="16" r="4" fill="white"/>
    <circle cx="27" cy="16" r="4" fill="white"/>
    <path d="M 12 28 Q 20 32 28 28" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- weisoft 文字 -->
    <text x="50" y="30" font-family="Arial" font-size="32" font-weight="bold" fill="url(#purpleGradient)">weisoft</text>
  </g>
  
  <!-- 装饰性数据流线条 -->
  <g opacity="0.3">
    <path d="M 100 400 Q 200 450 300 400" stroke="url(#purpleGradient)" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <path d="M 800 700 Q 900 750 1000 700" stroke="url(#blueGradient)" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <path d="M 150 1000 Q 250 1050 350 1000" stroke="url(#purpleGradient)" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  </g>
  
  <!-- 装饰性小圆点 -->
  <circle cx="500" cy="250" r="4" fill="#A78BFA" opacity="0.6"/>
  <circle cx="700" cy="600" r="4" fill="#60A5FA" opacity="0.6"/>
  <circle cx="300" cy="950" r="4" fill="#A78BFA" opacity="0.6"/>
  <circle cx="850" cy="450" r="4" fill="#60A5FA" opacity="0.6"/>
</svg>

